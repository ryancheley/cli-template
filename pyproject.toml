[project]
name = "cli-template"
version = "0.0.0"
description = "A modern Python CLI tool template"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ryan Cheley", email = "rcheley@gmail.com" }]
keywords = ["cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["click>=8.1", "rich>=13.0"]

[project.urls]
Homepage = "https://github.com/ryancheley/cli-template"
Repository = "https://github.com/ryancheley/cli-template"
Changelog = "https://github.com/ryancheley/cli-template/blob/main/CHANGELOG.md"
Issues = "https://github.com/ryancheley/cli-template/issues"

[project.scripts]
cli-template = "cli_template.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "ruff",
    "ty",
    "zizmor",
    "pip-audit",
    "twine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_template"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/cli_template"]

[tool.coverage.report]
fail_under = 80
show_missing = true
